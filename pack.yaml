ref: keycloak
label: "Keycloak Admin REST"
description: "Curated Keycloak Admin REST API actions with Attune Key-backed credentials"
version: "0.1.0"
author: "Attune; adapted from work by Michael Devlin and StackStorm Exchange contributors"
email: "support@attune.systems"
system: false
enabled: true

conf_schema: {}
config: {}

meta:
  category: integration
  documentation_url: "https://www.keycloak.org/docs-api/latest/rest-api/index.html"
  repository_url: "https://github.com/attune-packs/keycloak"
  source_repository: "https://github.com/StackStorm-Exchange/stackstorm-keycloak"
  source_revision: "f978f295fbdcf72d3bde62d73d3ea023ed45378f"
  source_version: "1.0.0"
  api_baseline: "Keycloak 26.7.1"
  license: "Apache-2.0"

tags: [keycloak, identity, iam, admin, integration]
runtime_deps: [python]
dependencies: []

testing:
  enabled: true
  discovery:
    method: directory
    path: tests
  runners:
    python:
      type: unittest
      entry_point: tests/test_pack.py
      timeout: 120
      result_format: simple
  min_pass_rate: 1.0
  on_failure: block
