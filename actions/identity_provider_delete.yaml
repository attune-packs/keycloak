ref: keycloak.identity_provider_delete
label: "Delete Identity Provider"
description: "Delete one identity provider by alias with exact confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: keycloak_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: pack.keycloak.credentials, required: true, description: "Pack-owned encrypted Keycloak credential Key ref"}
  realm: {type: string, required: true, description: "Target realm name, not realm ID"}
  alias: {type: string, required: true, description: "Identity-provider alias, not internal UUID"}
  confirm: {type: string, required: true, description: "Must equal delete:<realm>:identity-provider:<alias>"}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
output:
  operation: {type: string}
  realm: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [keycloak, identity-provider, delete]
