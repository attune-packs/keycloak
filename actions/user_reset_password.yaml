ref: keycloak.user_reset_password
label: "Reset User Password"
description: "Reset one user's password using a separate Attune Key; password is never an action input"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: keycloak_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: pack.keycloak.credentials, required: true, description: "Pack-owned encrypted Keycloak credential Key ref"}
  realm: {type: string, required: true, description: "Target realm name, not realm ID"}
  user_id: {type: string, required: true, description: "Internal Keycloak user UUID, not username"}
  password_key: {type: string, required: true, description: "Encrypted Attune Key containing a password string or password field"}
  temporary: {type: boolean, default: true}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
output:
  operation: {type: string}
  realm: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [keycloak, user, password, write]
