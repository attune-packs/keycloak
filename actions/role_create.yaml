ref: keycloak.role_create
label: "Create Role"
description: "Create a non-composite realm or client role from restricted fields"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: keycloak_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: keycloak.credentials, required: true, description: "Pack-owned encrypted Keycloak credential Key ref"}
  realm: {type: string, required: true, description: "Target realm name, not realm ID"}
  scope: {type: string, enum: [realm, client], default: realm}
  client_uuid: {type: string, description: "Required only for client scope; internal UUID, not clientId"}
  role: {type: object, required: true, description: "Restricted role object; name is required"}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
output:
  operation: {type: string}
  realm: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [keycloak, role, write]
