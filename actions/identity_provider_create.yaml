ref: keycloak.identity_provider_create
label: "Create Identity Provider"
description: "Create an identity provider; sensitive config is read only from a separate Attune Key"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: keycloak_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: pack.keycloak.credentials, required: true, description: "Pack-owned encrypted Keycloak credential Key ref"}
  realm: {type: string, required: true, description: "Target realm name, not realm ID"}
  identity_provider: {type: object, required: true, description: "Restricted IdP object; alias and providerId are required"}
  secret_config_key: {type: string, description: "Encrypted Attune Key containing sensitive IdP config string fields"}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
output:
  operation: {type: string}
  realm: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [keycloak, identity-provider, write]
