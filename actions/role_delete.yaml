ref: keycloak.role_delete
label: "Delete Role"
description: "Delete a realm or client role by display name with exact confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: keycloak_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: pack.keycloak.credentials, required: true, description: "Pack-owned encrypted Keycloak credential Key ref"}
  realm: {type: string, required: true, description: "Target realm name, not realm ID"}
  scope: {type: string, enum: [realm, client], default: realm}
  client_uuid: {type: string, description: "Required only for client scope; internal UUID, not clientId"}
  role_name: {type: string, required: true, description: "Role display name, not role UUID"}
  confirm: {type: string, required: true, description: "Must equal delete:<realm>:role:<realm-or-client_uuid>:<role_name>"}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
output:
  operation: {type: string}
  realm: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [keycloak, role, delete]
