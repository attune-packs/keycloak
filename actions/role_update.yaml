ref: keycloak.role_update
label: "Update Role"
description: "Update a realm or client role selected by role display name"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: keycloak_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: keycloak.credentials, required: true, description: "Pack-owned encrypted Keycloak credential Key ref"}
  realm: {type: string, required: true, description: "Target realm name, not realm ID"}
  scope: {type: string, enum: [realm, client], default: realm}
  client_uuid: {type: string, description: "Required only for client scope; internal UUID, not clientId"}
  role_name: {type: string, required: true, description: "Current role display name, not role UUID"}
  role: {type: object, required: true, description: "Restricted non-empty role update object"}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
output:
  operation: {type: string}
  realm: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [keycloak, role, write]
