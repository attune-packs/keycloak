ref: keycloak.authentication_flow_get
label: "Get Authentication Flow"
description: "Read-only inspection of one authentication flow by internal UUID"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: keycloak_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: pack.keycloak.credentials, required: true, description: "Pack-owned encrypted Keycloak credential Key ref"}
  realm: {type: string, required: true, description: "Target realm name, not realm ID"}
  flow_id: {type: string, required: true, description: "Internal authentication-flow UUID, not alias"}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
output:
  operation: {type: string}
  realm: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [keycloak, authentication-flow, read]
